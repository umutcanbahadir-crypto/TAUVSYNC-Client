name: TAUVSYNC client tests
on:
  push:
    branches:
      - "**"
    tags:
      - "client-v*"
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s client/tests -v
      - run: python -m compileall -q client packaging
      - name: Build bundled TAUVSYNC executable
        if: runner.os == 'Windows'
        run: |
          python -m pip install pyinstaller kicad-python==0.8.0 customtkinter==5.2.2 pillow==11.3.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TAUVSYNC --paths client --collect-all customtkinter --add-data "client/tauvsync/resources;tauvsync/resources" client/launcher.py
          python packaging/build_pcm.py
          python -m pip install jsonschema
          python packaging/validate_pcm.py dist/TAUVSYNC-KiCad10-2.1.0.zip
      - name: Smoke-test the actual packaged Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/TAUVSYNC.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA "TAUVSYNC/logs/launcher.log"
          if (Test-Path $log) { Get-Content $log }
          if ($proc.ExitCode -ne 0) { throw "Frozen TAUV executable failed runtime test: exit code $($proc.ExitCode)" }
          if (!(Test-Path $log) -or !(Select-String -Path $log -Pattern 'SELF-TEST OK' -Quiet)) { throw "Frozen executable did not complete its runtime self-test" }
      - name: Upload KiCad PCM test package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TAUVSYNC-KiCad10-Windows-testing
          path: |
            dist/TAUVSYNC.exe
            dist/TAUVSYNC-KiCad10-*.zip
            dist/TAUVSYNC-KiCad10-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish tested Windows PCM package
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TAUVSYNC-KiCad10-Windows-testing
          path: release
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/TAUVSYNC-KiCad10-*.zip release/TAUVSYNC-KiCad10-*.zip.sha256 --title "TAUV Team Projects $GITHUB_REF_NAME" --prerelease --verify-tag --repo "$GITHUB_REPOSITORY"
